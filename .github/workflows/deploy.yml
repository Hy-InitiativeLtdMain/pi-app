name: Build and deploy

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Laravel APP
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          password: ${{ secrets.SSH_PASS }}

          script: |
            # Path to the new and existing .env files
            NEW_ENV_FILE="env/.env"
            CURRENT_ENV_FILE="/var/www/piapp/.env"

            # Merge new .env settings into the current .env file
            while IFS= read -r line; do
              key=$(echo "$line" | cut -d '=' -f 1)
              sed -i "/^$key=/d" "$CURRENT_ENV_FILE"  # Remove existing key (if present)
              echo "$line" >> "$CURRENT_ENV_FILE"     # Append new key-value pair
            done < "$NEW_ENV_FILE"

            cd /var/www/piapp

            # Check for any changes and commit them
            if [[ `git status --porcelain` ]]; then
              git add .
              git commit -m "Commit hard-coded changes from server"

              # Try to push changes
              if ! git push origin develop; then
                echo "Merge conflict detected. Attempting to pull changes."
                git pull origin develop
                # Resolve conflicts (if any), manually intervene or use a strategy
                if [[ `git status --porcelain` ]]; then
                  echo "Merge conflicts occurred. Manual resolution required."
                  exit 1
                fi
                git push origin develop
              fi
            fi

            # Deploy to production
            git pull origin develop

            # Fix apt sources to use old-releases for EOL Ubuntu
            sudo sed -i 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            sudo apt-get update

            # Install grpc extension if not already installed
            if ! php -m | grep -q grpc; then
              # Add swap to avoid out-of-memory during compilation
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile

              sudo apt-get install -y php-pear php-dev
              sudo pecl install -f grpc || true

              # Remove swap after compilation
              sudo swapoff /swapfile
              sudo rm /swapfile

              PHP_INI=$(php -i | grep 'Loaded Configuration File' | awk '{print $5}')
              if ! grep -q "extension=grpc.so" "$PHP_INI"; then
                echo "extension=grpc.so" | sudo tee -a "$PHP_INI"
              fi
              sudo service apache2 reload || sudo service php8.1-fpm reload || true
            fi

            composer install

            php artisan migrate --force --seed
            php artisan config:cache
            php artisan route:cache
            php artisan cache:clear
            php artisan config:clear
